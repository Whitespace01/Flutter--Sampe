name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Regenerate android scaffolding (icons + gradle wrapper)
        run: |
          cp lib/main.dart /tmp/keep_main.dart
          cp pubspec.yaml /tmp/keep_pubspec.yaml
          flutter create --project-name flutter_sample --platforms=android .
          cp /tmp/keep_main.dart lib/main.dart
          cp /tmp/keep_pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-sample-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk --title "Flutter sample APK $TAG" --notes "Built by GitHub Actions"
          
